[package]
name = "figcraft-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft document model: pages, the node tree, properties, components, styles, variables, prototype data"

[lints]
workspace = true

[dependencies]
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
# Graybox: 3D rotation of layers (G17).
figcraft-tilt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
imbl = { workspace = true }
unicode-segmentation = { workspace = true }
base64 = { workspace = true }
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "mp3"] }
